<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Eigen — Get Free Books</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: radial-gradient(ellipse at top, #171b38 0%, #0a0c18 60%);
      color: #f4f5ff;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 1.5rem;
    }
    .wrap { width: 100%; max-width: 520px; text-align: center; }
    h1 {
      font-size: clamp(2rem, 6vw, 3rem);
      font-weight: 800;
      background: linear-gradient(135deg, #fff, #9db1ff, #b58cff);
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
      margin-bottom: 0.4rem;
    }
    p.tag { color: #a6adcf; margin-bottom: 2rem; }
    .bar {
      display: flex;
      gap: 0.5rem;
      background: rgba(255,255,255,0.04);
      border: 1px solid rgba(124,156,255,0.18);
      border-radius: 16px;
      padding: 0.5rem;
      backdrop-filter: blur(14px);
    }
    input {
      flex: 1; min-width: 0;
      padding: 0.9rem 1rem;
      background: transparent;
      border: none; outline: none;
      color: #f4f5ff; font-size: 1rem;
    }
    input::placeholder { color: #7a80a8; }
    button {
      padding: 0.9rem 1.5rem;
      border: none; border-radius: 12px;
      background: linear-gradient(135deg, #7c9cff, #b58cff);
      color: #fff; font-weight: 700; font-size: 0.95rem;
      cursor: pointer;
      box-shadow: 0 8px 24px rgba(124,156,255,0.35);
      transition: transform 0.15s, filter 0.2s;
      white-space: nowrap;
    }
    button:hover { transform: translateY(-1px); filter: brightness(1.1); }
    .status { margin-top: 1.5rem; color: #a6adcf; min-height: 1.2rem; font-size: 0.92rem; }
    .result {
      margin-top: 1.5rem;
      padding: 1.25rem;
      background: rgba(26,30,51,0.72);
      border: 1px solid rgba(124,156,255,0.18);
      border-radius: 14px;
      backdrop-filter: blur(14px);
      display: none;
    }
    .result.show { display: block; }
    .result h3 { margin-bottom: 0.35rem; font-size: 1.05rem; }
    .result .by { color: #a6adcf; font-size: 0.88rem; margin-bottom: 1rem; }
    .result a {
      display: inline-block;
      padding: 0.7rem 1.2rem;
      border-radius: 10px;
      background: linear-gradient(135deg, #7c9cff, #b58cff);
      color: #fff; font-weight: 700; font-size: 0.9rem;
      text-decoration: none;
      box-shadow: 0 6px 16px rgba(124,156,255,0.3);
    }
    .result a:hover { filter: brightness(1.1); }
  </style>
</head>
<body>
  <div class="wrap">
    <h1>📚 Eigen</h1>
    <p class="tag">Type a book title. Get it free.</p>

    <form id="form" class="bar">
      <input id="q" type="text" placeholder="e.g. Moby Dick" autocomplete="off" required />
      <button type="submit">Get book</button>
    </form>

    <div id="status" class="status"></div>
    <div id="result" class="result"></div>
  </div>

  <script>
    const form = document.getElementById("form");
    const qInput = document.getElementById("q");
    const status = document.getElementById("status");
    const result = document.getElementById("result");

    form.addEventListener("submit", async (e) => {
      e.preventDefault();
      const query = qInput.value.trim();
      if (!query) return;

      status.textContent = `Looking for "${query}"…`;
      result.classList.remove("show");

      try {
        // Gutendex — free, no key, no account, real PDFs and EPUBs
        const res = await fetch(
          `https://gutendex.com/books?search=${encodeURIComponent(query)}`
        );
        const data = await res.json();

        if (!data.results || data.results.length === 0) {
          status.textContent = `No free public-domain book found for "${query}".`;
          return;
        }

        const book = data.results[0];
        const formats = book.formats || {};

        // Prefer actual PDF, then EPUB, then plain text
        const pdf = formats["application/pdf"];
        const epub = formats["application/epub+zip"];
        const txt = formats["text/plain; charset=utf-8"] || formats["text/plain"];
        const link = pdf || epub || txt;
        const label = pdf ? "Download PDF" : epub ? "Download EPUB" : "Download TXT";

        if (!link) {
          status.textContent = "This book has no downloadable file.";
          return;
        }

        status.textContent = "";
        result.innerHTML = `
          <h3>${escapeHtml(book.title)}</h3>
          <p class="by">${escapeHtml(book.authors?.[0]?.name || "Unknown author")}</p>
          <a href="${link}" download target="_blank" rel="noopener">${label}</a>
        `;
        result.classList.add("show");
      } catch (err) {
        console.error(err);
        status.textContent = "Something went wrong. Try again.";
      }
    });

    function escapeHtml(s) {
      return String(s)
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");
    }
  </script>
</body>
</html>
